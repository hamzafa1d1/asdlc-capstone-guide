<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASDLC Capstone Guide</title>
  <meta name="description" content="Guide for the Agentic AI and ASDLC capstone projects supervised by Hamza Faidi at SUP'COM: free tools, Claude Code as a reference harness, core concepts, testing, project milestones and final delivery.">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () { try { var t = localStorage.getItem("asdlc-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234353d6'/><path d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/start" aria-label="ASDLC Capstone Guide, home">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 22l7-12 7 12" stroke="var(--bg)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">ASDLC Capstone</span>
      <span class="brand-sub">SUP'COM 2026-27</span>
    </a>
    <button class="search-btn" id="searchBtn" type="button" aria-label="Search the guide" aria-haspopup="dialog">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="search-label">Search</span>
      <kbd class="search-kbd" id="searchKbd">Ctrl K</kbd>
    </button>
    <div class="topbar-right">
      <a class="doc-link" id="docLink" href="#" target="_blank" rel="noopener">Project definitions<span aria-hidden="true"> ↗</span></a>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
        <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Guide sections"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main" id="content" tabindex="-1"></main>
  </div>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search the guide" hidden>
    <div class="palette-backdrop" data-close-palette></div>
    <div class="palette-box">
      <div class="palette-input-row">
        <svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="paletteInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search pages, terms, tools, components, milestones..." role="combobox" aria-expanded="true" aria-controls="paletteList" aria-autocomplete="list">
        <kbd>Esc</kbd>
      </div>
      <ul class="palette-list" id="paletteList" role="listbox" aria-label="Results"></ul>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <!-- Content parts: each file adds one section to window.GUIDE_PARTS. A missing file is skipped. -->
  <script src="content/tools.js"></script>
  <script src="content/harness.js"></script>
  <script src="content/concepts.js"></script>
  <script src="content/testing.js"></script>
  <script src="content/p1.js"></script>
  <script src="content/p2.js"></script>
  <script src="content/p3.js"></script>
  <!-- Site config, start page and final delivery; assembles the parts above. -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
